info:
  name: POST Create Configuration
  type: http
  seq: 3

http:
  method: post
  url: "{{ai_api_url}}/v2/lm/configurations"
  headers:
    - name: AI-Resource-Group
      value: default
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "test-deployment-{{modelName}}",
        "executableId": "{{executableId}}",
        "scenarioId": "{{scenarioId}}",
        "parameterBindings": []
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
