info:
  name: 9. Get predictions - none (with no context)
  type: http
  seq: 9

http:
  method: POST
  url: "{{ai_api_url}}/v2/inference/deployments/{{deployment_id}}/predict"
  headers:
    - name: ai-resource-group
      value: default
    - name: content-type
      value: application/json
    - name: x-aicore-service-plan
      value: sap-internal
      disabled: true
    - name: ai-main-tenant
      value: tta-m-sap-internal
      disabled: true
  body:
    type: json
    data: |-
      {
        "modelName": "{{modelName}}",
        "scenarioConfigName": "orchestration-tabular-scenario-config",
        "contextSelectionConfig": {
          "strategy": "none"
        },
        "predictionConfig": {
          "targetColumns": [
            {
              "name"  : "Location",
              "predictionPlaceholder": "[PREDICT]",
              "taskType": "classification"
            }
          ]
        },
        "columns": {
        "Car Brand": ["Hyundai", "Maruti", "Honda", "Hyundai", "Maruti", "Tata"],
        "Model": ["i20", "Swift", "City", "EonERA", "Wagon R 1.0LXI", "Alto K10LXI"],
        "Price": ["450000", "520000", "680000", "330399", "350199", "229199"],
        "Model Year": ["2018", "2019", "2017", "2016", "2011", "2011"],
        "Location": ["Mumbai", "Delhi", "Pune", "[PREDICT]", "[PREDICT]", "[PREDICT]"],
        "Fuel": ["Petrol", "Petrol", "Petrol", "Petrol", "Petrol", "Petrol"]
       
        }
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
