info:
  name: POST Create Configuration - TabPFN
  type: http
  seq: 1

http:
  method: post
  url: "{{ai_api_url}}/v2/lm/configurations"
  headers:
    - name: AI-Resource-Group
      value: default
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "tabpfn-test",
        "executableId": "aicore-sap",
        "scenarioId": "foundation-models",
        "parameterBindings": [
          {
            "key":"modelName",
            "value":"<ModelName>"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
