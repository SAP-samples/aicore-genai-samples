info:
  name: 2. Register Tabular Artifact
  type: http
  seq: 3

http:
  method: PUT
  url: "{{tcr_url}}/tabularArtifacts/{{test_prefix}}-tabular-artifact"
  headers:
    - name: ai-resource-group
      value: default
    - name: content-type
      value: application/json
    - name: x-aicore-service-plan
      value: sap-internal
  body:
    type: json
    data: |-
      {"dataDestinationName": "orchestration-tabular-ai",
        "type": "CSV",
        "path": "/github-pipeline/used-cars-1m.csv",
        "csnMetadata": {
        "entityName": "CarEntity",
        "definition": {
          "definitionType": "DOCUMENT",
          "document": {
            "definitions": {
              "CarEntity": {
                "kind": "entity",
                "elements": {
                  "idx": { "type": "cds.Integer" },
                  "Car Brand": { "type": "cds.String" },
                  "Model": { "type": "cds.String" },
                  "Price": { "type": "cds.Integer" },
                  "Model Year": { "type": "cds.Integer" },
                  "Location": { "type": "cds.String" },
                  "Fuel": { "type": "cds.String" },
                  "Driven (Kms)": { "type": "cds.Integer" },
                  "Gear": { "type": "cds.String" },
                  "Ownership": { "type": "cds.Integer" },
                  "EMI (monthly)": { "type": "cds.Integer" }
                }
              }
            }
          }
        }
        }}
  auth:
    type: bearer
    token: "{{bearer_token}}"

runtime:
  variables:
    - name: tcr_url
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
