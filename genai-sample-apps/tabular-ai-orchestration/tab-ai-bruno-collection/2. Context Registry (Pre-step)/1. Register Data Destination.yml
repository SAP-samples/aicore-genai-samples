info:
  name: 1. Register Data Destination
  type: http
  seq: 1

http:
  method: PUT
  url: "{{tcr_url}}/dataDestinations/{{test_prefix}}-tabular-ai"
  headers:
    - name: ai-resource-group
      value: default
    - name: content-type
      value: application/json
    - name: x-aicore-service-plan
      value: sap-internal
  body:
    type: json
    data: |-
      {
        "type": "S3",
        "config": {
          "bucket": "{{s3_bucket}}",
          "region": "{{s3_region}}",
          "access_key_id": "{{s3_access_key_id}}",
          "secret_access_key": "{{s3_secret_access_key}}"
        }
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

runtime:
  variables:
    - name: s3_bucket
      value: ""
    - name: s3_region
      value: ""
    - name: s3_access_key_id
      value: ""
    - name: s3_secret_access_key
      value: ""
    - name: tcr_url
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
